# Receta de XcodeGen: genera CEAD.xcodeproj a partir de esto.
#
# El proyecto no se versiona porque un .xcodeproj es un archivo generado y
# enorme, que produce conflictos de merge ilegibles cada vez que dos personas
# agregan un archivo. Esta receta dice lo mismo en treinta líneas que se leen.
#
#   brew install xcodegen && xcodegen generate

name: CEAD
options:
  bundleIdPrefix: net.caaguazu.cead
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  CeadKit:
    path: CeadKit

targets:
  CEAD:
    type: application
    platform: iOS
    sources:
      - path: CEAD
    dependencies:
      - package: CeadKit
        product: CeadKit
    # El Info.plist se genera desde acá y no se versiona aparte. Con XcodeGen,
    # `info.path` significa «escribí el plist en esta ruta»: un archivo propio
    # en esa misma ruta se pisa en la primera regeneración, y lo que se pierde
    # —la URL del sitio, la política de transporte— no avisa al desaparecer.
    info:
      path: CEAD/Info.plist
      properties:
        # El sitio del colegio, de donde cuelga la API. Vive acá para que
        # apuntar la app a otro entorno sea cambiar un valor y no salir a
        # buscar la URL por los archivos.
        CeadSitio: https://cead.caaguazu.net

        UILaunchScreen:
          UIColorName: FondoLanzamiento

        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

        # Sin excepciones de transporte: la app manda una contraseña y guarda un
        # token de larga vida, así que HTTP en claro no se habilita para nada.
        # El servidor además rechaza el login fuera de HTTPS, de modo que una
        # excepción acá tampoco serviría para «probar rápido».
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.caaguazu.cead.panel
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
