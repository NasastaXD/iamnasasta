org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# En Linux (y en CI) no hay forma de compilar los destinos de Apple. Se declaran
# igual, para que el mismo proyecto compile en el Mac, y acá se saltean sin ruido.
kotlin.native.ignoreDisabledTargets=true
# No bajar el toolchain de Kotlin/Native si nadie lo va a usar.
kotlin.mpp.enableCInteropCommonization=false
