# ============================================================================
# CEAD Académico — proxy inverso para el bridge de WhatsApp
#
#   sudo cp nginx-cead-bridge.conf /etc/nginx/sites-available/cead-bridge
#   sudo ln -s /etc/nginx/sites-available/cead-bridge /etc/nginx/sites-enabled/
#   # reemplazá bot.TU-DOMINIO.com por tu subdominio real
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d bot.TU-DOMINIO.com     # ← agrega el HTTPS solo
#
# El HTTPS no es opcional: por acá viaja el token compartido en cada request.
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name bot.TU-DOMINIO.com;

    # Las imágenes de comunicados viajan en base64 dentro del JSON. El default
    # de nginx (1 MB) corta cualquier foto de celular; el bridge acepta 25 MB.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Una nota de voz se transcribe y recién ahí contesta la IA: el bridge
        # espera hasta 120 s (WP_TIMEOUT_AUDIO_MS). Si nginx corta antes, la
        # respuesta se pierde igual.
        proxy_connect_timeout 10s;
        proxy_send_timeout    130s;
        proxy_read_timeout    130s;
    }
}
